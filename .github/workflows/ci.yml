name: KBL source validation

on:
  push:
    branches: [ main, preview ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: node scripts/audit-source.js
      - run: npm run test:security
      - run: npm run test:release
      - run: npm run test:ui
      - run: npm run test:ai
      - run: npm run test:routes
      - run: npm run test:growth
      - run: npm run test:startup
      - run: npm run test:portable
