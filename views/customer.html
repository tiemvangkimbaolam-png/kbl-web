<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Hồ sơ khách hàng Kim Bảo Lâm: thông tin mua hàng, sản phẩm đã quan tâm và voucher trên thiết bị này.">
  <title>Hồ sơ khách hàng | Kim Bảo Lâm</title>
  <style>
    :root{--navy:#082443;--gold:#d9a51d;--bg:#f6f8fb;--ink:#14243a;--muted:#64748b;--line:#e2e8f0}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef3f8,#fff 48%,#fbf8ef);font-family:Arial,sans-serif;color:var(--ink)}
    .wrap{width:min(900px,calc(100% - 28px));margin:32px auto}.top{display:flex;justify-content:space-between;align-items:center;gap:14px}.brand{font-weight:900;color:var(--navy);font-size:22px}.brand span{color:#a87800}.top a{color:#0b5aa5;font-weight:800;text-decoration:none}
    .card{margin-top:18px;padding:22px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 30px rgba(8,36,67,.08)}h1{margin:0;color:var(--navy);font-size:30px}.muted{color:var(--muted);line-height:1.55}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}.box{padding:14px;border:1px solid var(--line);border-radius:12px;background:#fbfcfe}.box span{display:block;color:var(--muted);font-size:11px}.box b{display:block;margin-top:5px;color:var(--navy)}
    h2{margin:24px 0 10px;color:var(--navy);font-size:18px}.list{display:grid;gap:8px}.item{padding:12px;border:1px solid var(--line);border-radius:10px}.voucher{background:#fff8dc;border-color:#e8cf7e}.empty{padding:14px;border-radius:10px;background:#f8fafc;color:var(--muted)}button{border:0;border-radius:9px;padding:11px 14px;background:var(--navy);color:#fff;font-weight:800;cursor:pointer}.danger{background:#8b2d35}
    @media(max-width:640px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.wrap{margin:18px auto}.card{padding:17px}h1{font-size:26px}}
  </style>

    <!-- KBL PWA N10 -->
    <link rel="manifest" href="/manifest.webmanifest?v=n10-loyalty-growth-ai" />
    <link rel="icon" type="image/png" sizes="64x64" href="/pwa/kbl-app-r8-1-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa/kbl-app-r8-1-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Kim Bảo Lâm" />
    <meta name="mobile-web-app-capable" content="yes" />
</head>
<body>
  <main class="wrap">
    <div class="top"><div class="brand">◆ <span>KIM BẢO LÂM</span></div><a href="/">← Về trang chủ</a></div>
    <section class="card"><h1>Hồ sơ khách hàng</h1><p class="muted">Hồ sơ này được nhận diện bằng cookie bảo mật trên thiết bị đã chọn “Ghi nhớ hồ sơ”. Không dùng để mở CCCD, hồ sơ cầm đồ hay dữ liệu tài chính riêng.</p><div id="content"><div class="empty">Đang kiểm tra hồ sơ…</div></div></section>
  </main>
  <script>
    const safe=(v)=>{const s=document.createElement('span');s.textContent=v==null?'':String(v);return s.innerHTML};
    const money=(v)=>new Intl.NumberFormat('vi-VN').format(Number(v)||0)+'đ';
    async function load(){
      const box=document.getElementById('content');
      try{
        const r=await fetch('/api/customer/me',{cache:'no-store'}),d=await r.json();
        if(!r.ok||!d.success)throw new Error(d.message||'Không tải được hồ sơ');
        const c=d.customer;
        if(!c){box.innerHTML='<div class="empty">Thiết bị này chưa có hồ sơ khách hàng. Khi tư vấn/mua hàng, chọn “Ghi nhớ hồ sơ” để lần sau website nhận ra anh/chị.</div>';return;}
        const recent=(c.recentProducts||[]).length?(c.recentProducts||[]).map(p=>'<div class="item"><b>'+safe([p.sku,p.name].filter(Boolean).join(' · '))+'</b><div class="muted">'+safe(p.status||'Đã quan tâm')+(p.at?' · '+safe(new Date(p.at).toLocaleDateString('vi-VN')):'')+'</div></div>').join(''):'<div class="empty">Chưa có sản phẩm lưu trong lịch sử.</div>';
        const vouchers=(c.vouchers||[]).length?(c.vouchers||[]).map(v=>'<div class="item voucher"><b>'+safe(v.code||'VOUCHER')+' · '+safe(v.title||'Ưu đãi Kim Bảo Lâm')+'</b>'+(v.expiresAt?'<div class="muted">Hạn dùng '+safe(new Date(v.expiresAt).toLocaleDateString('vi-VN'))+'</div>':'')+'</div>').join(''):'<div class="empty">Hiện chưa có voucher đang hoạt động.</div>';
        box.innerHTML='<div class="grid"><div class="box"><span>Khách hàng</span><b>'+safe(c.name||'—')+'</b></div><div class="box"><span>Số điện thoại</span><b>'+safe(c.phone||'—')+'</b></div><div class="box"><span>Địa chỉ gần nhất</span><b>'+safe(c.primaryAddress||c.location||'—')+'</b></div><div class="box"><span>Lịch sử</span><b>'+Number(c.orderCount||0)+' yêu cầu · '+Number(c.completedOrders||0)+' hoàn tất</b></div><div class="box"><span>Tổng giá trị đơn hoàn tất</span><b>'+money(c.totalCompletedValue)+'</b></div><div class="box"><span>Nhận ưu đãi</span><b>'+(c.marketingConsent?'Đã đồng ý':'Chưa đăng ký')+'</b></div></div><h2>Sản phẩm gần đây</h2><div class="list">'+recent+'</div><h2>Voucher</h2><div class="list">'+vouchers+'</div><div style="margin-top:22px"><button class="danger" id="forget" type="button">Quên hồ sơ trên thiết bị này</button></div>';
        document.getElementById('forget')?.addEventListener('click',async()=>{if(!confirm('Chỉ xóa liên kết hồ sơ trên thiết bị này, dữ liệu giao dịch tại tiệm vẫn được giữ theo quy định. Tiếp tục?'))return;await fetch('/api/customer/logout',{method:'POST'});location.reload();});
      }catch(e){box.innerHTML='<div class="empty">'+safe(e.message||'Không tải được hồ sơ')+'</div>'}
    }
    load();
  </script>

    <script defer src="/pwa-register.js?v=n10-loyalty-growth-ai"></script>
</body>
</html>
