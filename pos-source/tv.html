<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bảng giá vàng • Tiệm vàng</title><style>
:root{--bg:#700914;--main:#920e1c;--gold:#ffe17a;--gold2:#f4be39;--text:#fff4c5;--line:#f0b52d;--muted:#ffdda1}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Arial,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(ellipse at top,#a51b27 0%,var(--bg) 65%);padding:clamp(14px,2.2vh,28px) clamp(16px,2.5vw,45px)}
body.light{--bg:#f8f7f2;--main:#fff8e6;--gold:#825400;--gold2:#9f6d00;--text:#182844;--line:#c89c2d;--muted:#63562e;background:#f8f7f2}
.page{height:100%;display:flex;flex-direction:column;max-width:2100px;margin:0 auto;gap:clamp(10px,1.5vh,18px)}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:3px solid var(--line);padding-bottom:clamp(9px,1.3vh,16px)}
.brand{font-size:clamp(32px,3.6vw,78px);font-weight:900;line-height:1.1;color:var(--gold);letter-spacing:.005em;overflow-wrap:anywhere}
.subtitle{font-size:clamp(16px,1.45vw,29px);margin-top:8px;color:var(--muted);font-weight:700}
.clock{font-size:clamp(18px,1.7vw,34px);text-align:right;font-weight:800;color:var(--text);line-height:1.4;min-width:230px}
.board{flex:1;min-height:0;display:flex;flex-direction:column;gap:clamp(9px,1.3vh,16px)}.board-title{font-family:Georgia,serif;text-transform:uppercase;font-weight:900;font-size:clamp(28px,2.8vw,56px);color:var(--gold);text-align:center;line-height:1.05;margin:0}
.rows{flex:1;min-height:0;display:grid;grid-template-rows:repeat(3,minmax(0,1fr));gap:clamp(8px,1.25vh,16px)}.gold-row{background:var(--main);border:2px solid var(--line);border-radius:16px;display:grid;grid-template-columns:minmax(200px,.75fr) minmax(200px,1fr) minmax(200px,1fr);align-items:center;padding:clamp(10px,1.3vw,27px);gap:12px;box-shadow:inset 0 0 0 1px #d6a84f44}
.gold-name{font-size:clamp(26px,2.75vw,57px);font-weight:900;color:var(--gold);line-height:1.1}.cell{text-align:center}.label{display:block;font-size:clamp(20px,1.8vw,35px);font-weight:800;line-height:1.1;margin-bottom:7px}.buy,.sell{display:block;color:var(--gold);font-weight:900;line-height:1;letter-spacing:-.035em;font-variant-numeric:tabular-nums;font-size:clamp(42px,4.05vw,90px);white-space:nowrap}.sell{color:var(--text)}.unit{font-size:.34em;vertical-align:baseline;margin-left:5px}
.rows.many .gold-row{padding:clamp(6px,.65vw,14px)}.rows.many .gold-name{font-size:clamp(21px,2vw,36px)}.rows.many .label{font-size:clamp(15px,1.25vw,23px)}.rows.many .buy,.rows.many .sell{font-size:clamp(31px,3vw,60px)}
footer{display:flex;justify-content:space-between;gap:20px;font-size:clamp(14px,1.2vw,25px);font-weight:700;color:var(--muted);border-top:2px solid var(--line);padding-top:12px}.warn{color:#ffcc51}.connected{color:inherit}
@media(max-width:1100px){.gold-row{grid-template-columns:minmax(130px,.75fr) repeat(2,minmax(0,1fr))}.buy,.sell{font-size:clamp(31px,4.2vw,58px)}.gold-name{font-size:clamp(23px,3vw,38px)}}
@media(max-width:650px){body{padding:12px}.clock{min-width:0;font-size:13px}header{gap:8px}.brand{font-size:25px}.subtitle{font-size:12px}.board-title{font-size:23px}.gold-row{grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;gap:4px 8px;padding:12px}.gold-name{grid-column:1/-1;font-size:26px}.label{font-size:15px}.buy,.sell{font-size:clamp(23px,5.8vw,33px)}footer{font-size:11px}}
</style></head><body><div class="page"><header><div><div id="brand" class="brand">TIỆM VÀNG</div><div class="subtitle">GIÁ VÀNG HÔM NAY • VNĐ / CHỈ</div></div><div class="clock" id="clock">—</div></header><main class="board"><h1 class="board-title">Bảng giá vàng</h1><section id="rows" class="rows" aria-live="polite"></section></main><footer><span id="status">Đang kết nối POS Windows…</span><span id="updated">Chưa có giá mới</span></footer></div>
<script>
const LABELS={'9999':'VÀNG 9999','980':'VÀNG 980','750':'VÀNG 750','610':'VÀNG 610','585':'VÀNG 585','416':'VÀNG 416'};
const fmt=new Intl.NumberFormat('vi-VN');let lastPayload=0,lastServerUpdate=0,running=false,types=['9999','980','610'];
function tick(){document.getElementById('clock').textContent=new Intl.DateTimeFormat('vi-VN',{hour:'2-digit',minute:'2-digit',second:'2-digit',day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date());if(lastPayload&&Date.now()-lastPayload>15000)document.getElementById('status').textContent='⚠ MẤT KẾT NỐI • GIÁ HIỂN THỊ LẦN CUỐI';}
async function settings(){try{const [shop,cfg]=await Promise.all([fetch('/api/shop-info',{cache:'no-store'}).then(x=>x.json()),fetch('/api/tv-config',{cache:'no-store'}).then(x=>x.json())]);document.getElementById('brand').textContent=shop?.shop?.shopName||'TIỆM VÀNG';types=(cfg.types||types).filter(x=>LABELS[x]);if(!types.length)types=['9999','980','610'];document.body.classList.toggle('light',new URLSearchParams(location.search).get('theme')==='light'||(new URLSearchParams(location.search).get('theme')!=='red'&&cfg.theme==='light'));document.getElementById('rows').classList.toggle('many',types.length>3);document.getElementById('rows').style.gridTemplateRows=`repeat(${types.length},minmax(0,1fr))`;}catch(_){}}
async function load(){if(running)return;running=true;try{const r=await fetch('/api/prices?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('unreachable');const p=await r.json();if(p.success===false||!p.prices)throw Error('invalid');const data=p.prices;document.getElementById('rows').innerHTML=types.map(code=>`<article class="gold-row"><div class="gold-name">${LABELS[code]}</div><div class="cell"><span class="label">MUA VÀO</span><span class="buy">${Number(data['price_buy_'+code])>0?fmt.format(Number(data['price_buy_'+code])):'—'}</span></div><div class="cell"><span class="label">BÁN RA</span><span class="sell">${Number(data['price_sell_'+code])>0?fmt.format(Number(data['price_sell_'+code])):'—'}</span></div></article>`).join('');lastPayload=Date.now();lastServerUpdate=Date.parse(p.updatedAt||'')||lastPayload;document.getElementById('status').textContent='● KẾT NỐI POS WINDOWS';document.getElementById('updated').textContent=p.updatedAt?'Giá lưu lần cuối: '+new Intl.DateTimeFormat('vi-VN',{hour:'2-digit',minute:'2-digit',second:'2-digit',day:'2-digit',month:'2-digit'}).format(lastServerUpdate):'Chưa có thời điểm chốt giá'}catch(_){if(!lastPayload||Date.now()-lastPayload>10000)document.getElementById('status').textContent='⚠ MẤT KẾT NỐI • KHÔNG GIAO DỊCH DỰA VÀO GIÁ CŨ'}finally{running=false}}
(async()=>{await settings();tick();await load()})();setInterval(tick,1000);setInterval(load,3000);setInterval(settings,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){settings();load()}});
</script></body></html>
