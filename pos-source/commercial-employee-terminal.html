<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nhân viên POS · cửa hàng</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#102a44;font:15px Arial,sans-serif}
header{background:#092d53;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px}
header strong{font-size:19px}header small{display:block;color:#c8d9ee;margin-top:5px}button{padding:10px 14px;border:0;border-radius:9px;background:#ca9c24;color:#132c4a;font-weight:800;cursor:pointer}
button.secondary{background:#e4edfa}main{padding:12px;max-width:1250px;margin:auto}#roles{background:white;border:1px solid #dbe5ef;border-radius:10px;padding:11px 14px;line-height:1.5;margin-bottom:10px}
iframe{height:calc(100vh - 185px);min-height:450px;width:100%;border:1px solid #d5dfea;border-radius:13px;background:white}#passwordDialog{background:#fff;border:1px solid #ddd;border-radius:14px;padding:22px;max-width:420px}input{width:100%;padding:12px;margin:6px 0 14px;border:1px solid #bed0df;border-radius:8px}#feedback{color:#b23030}#passwordDialog::backdrop{background:#03162888}
</style></head><body>
<header><div><strong id="heading">Nhân viên – POS Windows</strong><small>Chế độ hạn chế · Tài khoản do chủ tiệm cấp · Máy chủ dữ liệu tại Windows</small></div><div><button class="secondary" id="change">Đổi mật khẩu</button> <button id="exit">Đăng xuất</button></div></header>
<main><section id="roles" aria-live="polite">Đang kiểm tra phiên đăng nhập…</section><iframe id="remote" title="Chức năng nhân viên" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-downloads" referrerpolicy="no-referrer" allow="camera" src="/remote"></iframe></main>
<dialog id="passwordDialog"><h3>Đổi mật khẩu nhân viên</h3><label>Mật khẩu hiện tại<input id="current" type="password" autocomplete="current-password"></label><label>Mật khẩu mới (tối thiểu 10 ký tự)<input id="next" type="password" autocomplete="new-password"></label><button id="save">Đổi mật khẩu</button> <button class="secondary" id="cancel">Hủy</button><p id="feedback"></p></dialog>
<script>
const $=s=>document.querySelector(s);let actor=null;
async function initialize(){try{const r=await fetch('/api/remote/me',{cache:'no-store'});const d=await r.json();if(!r.ok||!d.success)throw Error('Phiên nhân viên không hợp lệ.');actor=d.user;$('#heading').textContent='Nhân viên: '+actor.username;const p=actor.permissions||[];const labels={'prices.read':'Xem bảng giá','prices.write':'Chỉnh bảng giá','pawn.read':'Tra phiếu cầm','pawn.write':'Đóng lãi / chuộc','identity.upload':'Quét CCCD / VNeID'};$('#roles').textContent='Vai trò: '+actor.role+' · Quyền được cấp: '+(p.filter(x=>labels[x]).map(x=>labels[x]).join(' · ')||'Chưa có quyền nghiệp vụ')+' · Chỉ sử dụng các chức năng đang được phép trong Remote.';}catch(e){$('#roles').textContent=e.message;$('#remote').hidden=true;}}
async function quit(){try{await fetch('/api/remote/logout',{method:'POST',headers:{'Content-Type':'application/json'}})}catch(_){}location.assign('/staff-exit')}
$('#exit').onclick=quit;$('#change').onclick=()=>$('#passwordDialog').showModal();$('#cancel').onclick=()=>$('#passwordDialog').close();
$('#save').onclick=async()=>{try{const r=await fetch('/api/remote/password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({current:$('#current').value,next:$('#next').value})});const d=await r.json();if(!r.ok)throw Error(d.message||'Không đổi được mật khẩu.');$('#feedback').style.color='#168b57';$('#feedback').textContent='Đã đổi mật khẩu. Vui lòng đăng nhập lại.';setTimeout(()=>location.assign('/staff-exit'),800)}catch(e){$('#feedback').style.color='#b23030';$('#feedback').textContent=e.message||'Lỗi không xác định'}};
initialize();
</script></body></html>
